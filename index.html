<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>سامانه گزارش و تسویه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }, colors: { primary: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' } } } } }
    </script>
    <style>
        body { background-color: #f8fafc; } .dark body { background-color: #0f172a; }
        body, div, nav, header, button, input, label, span, textarea { transition: all 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; } .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-color: rgba(51, 65, 85, 0.5); }
        
        /* استایل‌های اصلاح شده و زیبای تقویم */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-day { 
            display: flex; align-items: center; justify-content: center; 
            aspect-ratio: 1; font-size: 14px; cursor: pointer; 
            border-radius: 8px; transition: background-color 0.2s; 
            color: #334155; font-weight: 500;
        }
        .dark .cal-day { color: #cbd5e1; }
        .cal-day:hover { background-color: #f0fdfa; color: #0f766e; }
        .dark .cal-day:hover { background-color: #134e4a; color: #5eead4; }
        .cal-day.selected { background-color: #0d9488 !important; color: #fff !important; font-weight: 700; }
        .cal-day.today { border: 2px solid #14b8a6; }
        .cal-header { color: #94a3b8; font-size: 12px; font-weight: 700; text-align: center; padding-bottom: 8px; }
        .date-input-wrapper { position: relative; }
        .date-input-wrapper input { cursor: pointer; }
        .date-input-wrapper::after { content: '🗓'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 16px; opacity: 0.7; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 min-h-screen antialiased">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-950">
        <div class="glass rounded-3xl p-8 w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-xl font-black mb-6">ورود به سامانه</h2>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="emailInput" required class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-primary-500" placeholder="ایمیل">
                <input type="password" id="passwordInput" required class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-primary-500" placeholder="رمز عبور">
                <p id="loginError" class="text-xs text-red-500 hidden">اطلاعات اشتباه است!</p>
                <button type="submit" id="loginBtn" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">ورود</button>
            </form>
        </div>
    </div>

    <!-- پنل ادمین -->
    <div id="adminWrapper" class="hidden">
        <header class="sticky top-0 z-40 glass border-b border-slate-200/50 dark:border-slate-800/50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <h1 class="text-lg font-black tracking-tight">پنل مدیریت گزارش‌ها</h1>
                <button id="logoutBtn" class="px-4 py-2.5 rounded-xl bg-red-50 text-red-600 text-sm font-bold border border-red-100">خروج</button>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-black">فهرست تایپیست‌ها</h2>
                <button id="addPersonBtn" class="bg-primary-600 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-lg">+ تایپیست جدید</button>
            </div>
            <div id="adminList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </main>
    </div>

    <!-- پورتال تایپیست -->
    <div id="userWrapper" class="hidden max-w-3xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black">پنل کارکرد: <span id="userName"></span></h1>
            <button id="logoutBtn2" class="px-4 py-2 rounded-xl bg-red-50 text-red-600 text-sm font-bold border border-red-100">خروج</button>
        </div>
        
        <div class="glass rounded-2xl p-5 border border-slate-200/50 mb-6 text-center">
            <p class="text-sm text-slate-500 mb-1">وضعیت دوره فعلی</p>
            <p id="userStatus" class="text-xl font-black text-blue-600">در حال بررسی...</p>
        </div>

        <div class="glass rounded-2xl p-6 border border-slate-200/50 space-y-4 mb-8">
            <h2 class="text-lg font-bold">ثبت گزارش ۱۰ روزه</h2>
            <form id="userWorkForm" class="space-y-4">
                <div><label class="block text-xs font-bold mb-1">عنوان کار</label><input type="text" id="userWorkTitle" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs font-bold mb-1">تعداد صفحه</label><input type="number" id="userWorkPages" value="0" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm"></div>
                    <div><label class="block text-xs font-bold mb-1">توضیحات</label><input type="text" id="userWorkDesc" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm"></div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">ثبت گزارش</button>
            </form>
        </div>
        <h2 class="text-lg font-bold mb-4">سوابق شما</h2>
        <div id="userWorkList" class="space-y-2"></div>
    </div>

    <!-- مودال ثبت تایپیست -->
    <div id="personModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" id="personBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl border border-slate-200 pointer-events-auto">
                <div class="flex justify-between items-center p-6 border-b border-slate-100">
                    <h2 class="text-lg font-black" id="personModalTitle">ثبت تایپیست</h2>
                    <button id="closePersonBtn" class="text-slate-400 hover:text-slate-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
                <div class="p-6">
                    <form id="personForm" class="space-y-4">
                        <input type="hidden" id="personId">
                        <div><label class="block text-xs font-bold mb-1">نام</label><input type="text" id="pName" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm"></div>
                        <div><label class="block text-xs font-bold mb-1">شماره تماس</label><input type="tel" id="pPhone" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm" dir="ltr"></div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-blue-600">تاریخ دریافت کار (شروع ۱۰ روز)</label>
                            <div class="date-input-wrapper">
                                <input type="text" id="pDeliveryDate" placeholder="انتخاب از تقویم" required readonly class="w-full bg-slate-50 dark:bg-slate-950 border border-blue-200 rounded-xl py-2.5 px-4 text-sm" dir="ltr">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-3 rounded-xl shadow-lg">ذخیره</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تسویه حساب -->
    <div id="settleModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" id="settleBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl border border-slate-200 pointer-events-auto">
                <div class="flex justify-between items-center p-6 border-b border-slate-100">
                    <h2 class="text-lg font-black">ثبت تسویه حساب</h2>
                    <button id="closeSettleBtn" class="text-slate-400 hover:text-slate-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
                <div class="p-6">
                    <form id="settleForm" class="space-y-4">
                        <input type="hidden" id="settlePersonId">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs font-bold mb-1">تعداد (کلمه/صفحه)</label><input type="number" id="settleQty" value="0" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm" oninput="window.calcSettle()"></div>
                            <div><label class="block text-xs font-bold mb-1">نرخ هر واحد</label><input type="number" id="settleRate" value="0" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm" oninput="window.calcSettle()"></div>
                        </div>
                        <div><label class="block text-xs font-bold mb-1">مبلغ کل (تومان)</label><input type="number" id="settleAmount" required readonly class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 rounded-xl py-2.5 px-4 text-sm font-bold"></div>
                        <div><label class="block text-xs font-bold mb-1">توضیحات</label><input type="text" id="settleDesc" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 rounded-xl py-2.5 px-4 text-sm"></div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg">ثبت تسویه</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تقویم -->
    <div id="calendarModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm cal-backdrop"></div>
        <div class="bg-white dark:bg-slate-900 w-full max-w-xs rounded-3xl shadow-2xl border border-slate-200 p-6 relative z-10 pointer-events-auto"><div id="calendarContainer"></div></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
