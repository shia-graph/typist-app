<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به سامانه تایپ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- کلاینت رسمی Supabase (بدون eval) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #1e293b;
    }
    .card {
      background: #fff;
      border-radius: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      border: 1px solid #f1f5f9;
      padding: 2rem;
      width: 100%;
      max-width: 28rem;
      transition: all .2s ease;
    }
    @media (min-width: 768px) { .card { padding: 2.5rem; } }

    .icon-wrap { display: flex; justify-content: center; margin-bottom: 1.25rem; }
    .icon-box {
      width: 4rem; height: 4rem;
      background: #eef2ff;
      border: 1px solid rgba(224,231,255,0.8);
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      font-size: 1.875rem;
    }

    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 {
      font-size: 1.5rem; font-weight: 900; color: #1e293b;
      margin: 0 0 .5rem; letter-spacing: -.025em;
    }
    .header p {
      font-size: .875rem; color: #94a3b8; font-weight: 500; margin: 0;
    }

    .tabs {
      background: #f8fafc;
      padding: .375rem;
      border-radius: 1rem;
      display: flex; gap: .25rem;
      border: 1px solid rgba(226,232,240,0.6);
      margin-bottom: 1.5rem;
    }
    .tab {
      flex: 1;
      padding: .625rem .75rem;
      border-radius: .75rem;
      font-size: .875rem;
      font-weight: 700;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      color: #64748b;
      font-family: inherit;
    }
    .tab:hover { color: #334155; }
    .tab.tab-active {
      background: #fff;
      color: #4f46e5;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid rgba(226,232,240,0.5);
    }
    .tab svg { width: 1rem; height: 1rem; }

    form { display: flex; flex-direction: column; gap: 1.25rem; }
    form.hidden { display: none; }

    label {
      display: block;
      font-size: .875rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: .5rem;
      text-align: right;
    }

    .input-wrap { position: relative; }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: .875rem 1rem;
      border-radius: 1rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      text-align: center;
      font-family: inherit;
      font-size: .95rem;
      transition: all .2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      outline: none;
    }
    input[type="password"] { letter-spacing: .2em; padding-left: 3rem; }
    input::placeholder { color: #cbd5e1; }
    input:focus {
      border-color: transparent;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.35), 0 1px 2px rgba(0,0,0,0.04);
    }

    .toggle-pass {
      position: absolute;
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: #94a3b8;
      cursor: pointer;
      padding: .25rem;
      display: flex;
      transition: color .2s;
    }
    .toggle-pass:hover { color: #475569; }
    .toggle-pass svg { width: 1.25rem; height: 1.25rem; }

    .btn {
      width: 100%;
      padding: .875rem 1rem;
      border-radius: 1rem;
      border: 0;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .btn:active:not(:disabled) { transform: scale(.99); }
    .btn:disabled { opacity: .7; cursor: not-allowed; }
    .btn-admin { background: #4f46e5; }
    .btn-admin:hover:not(:disabled) { background: #4338ca; }
    .btn-typist { background: #0f172a; }
    .btn-typist:hover:not(:disabled) { background: #000; }

    .spinner {
      display: inline-block;
      width: 1rem; height: 1rem;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      margin-top: 1rem;
      padding: .75rem;
      border-radius: .75rem;
      font-size: .75rem;
      font-weight: 600;
      text-align: center;
    }
    .alert.hidden { display: none; }
    .alert-error { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .alert-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-box">📝</div>
    </div>

    <div class="header">
      <h1>ورود به سامانه تایپ</h1>
      <p>برای مشاهده یا ثبت کارکرد، وارد حساب خود شوید</p>
    </div>

    <div class="tabs" role="tablist" aria-label="انتخاب نقش">
      <button type="button" id="tab-typist" role="tab" aria-selected="false"
        data-role="typist" class="tab">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        تایپیست
      </button>

      <button type="button" id="tab-admin" role="tab" aria-selected="true"
        data-role="admin" class="tab tab-active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        مدیر سامانه
      </button>
    </div>

    <form id="form-admin" novalidate>
      <div>
        <label for="admin-password">رمز عبور مدیریت</label>
        <div class="input-wrap">
          <input type="password" id="admin-password" required autocomplete="current-password"
            placeholder="••••••" />
          <button type="button" id="toggle-admin-pass" class="toggle-pass" aria-label="نمایش رمز عبور">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-admin-submit" class="btn btn-admin">
        <span>ورود به پنل مدیریت</span>
      </button>
    </form>

    <form id="form-typist" class="hidden" novalidate>
      <div>
        <label for="typist-identifier">کد ملی یا شماره همراه</label>
        <input type="text" id="typist-identifier" required inputmode="numeric" autocomplete="username"
          placeholder="مثال: 09123456789 یا کد ملی" />
      </div>

      <button type="submit" id="btn-typist-submit" class="btn btn-typist">
        <span>ورود به پرتال تایپیست</span>
      </button>
    </form>

    <div id="login-alert" role="alert" aria-live="polite" class="alert hidden"></div>
  </div>

  <!-- فایل JS جداگانه -->
  <script src="./login.js"></script>
</body>
</html>
