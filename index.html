<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به سامانه تایپ</title>
  
  <!-- فونت وزیرمتن و استایل‌های تیلویند -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- کلاینت رسمی سوپابیس -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <!-- کارت اصلی ورود -->
  <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 p-8 md:p-10 w-full max-w-md mx-auto transition-all">
    
    <!-- آیکون بالای کارت -->
    <div class="flex justify-center mb-5">
      <div class="w-16 h-16 bg-indigo-50 border border-indigo-100/80 rounded-2xl flex items-center justify-center shadow-sm">
        <span class="text-3xl">📝</span>
      </div>
    </div>

    <!-- تیتر و توضیح -->
    <div class="text-center space-y-2 mb-8">
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">ورود به سامانه تایپ</h1>
      <p class="text-xs md:text-sm text-slate-400 font-medium">برای مشاهده یا ثبت کارکرد، وارد حساب خود شوید</p>
    </div>

    <!-- تب‌های انتخاب نقش (تایپیست / مدیر سامانه) -->
    <div class="bg-slate-50 p-1.5 rounded-2xl flex items-center gap-1 border border-slate-200/60 mb-6">
      <button 
        type="button" 
        id="tab-typist" 
        onclick="switchTab('typist')" 
        class="flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 hover:text-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        تایپیست
      </button>

      <button 
        type="button" 
        id="tab-admin" 
        onclick="switchTab('admin')" 
        class="flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 bg-white text-indigo-600 shadow-sm border border-slate-200/50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        مدیر سامانه
      </button>
    </div>

    <!-- فرم ورود مدیر سامانه (پیش‌فرض مطابق عکس) -->
    <form id="form-admin" onsubmit="handleAdminLogin(event)" class="space-y-5">
      <div>
        <label for="admin-password" class="block text-xs md:text-sm font-bold text-slate-700 mb-2 text-right">
          رمز عبور مدیریت
        </label>
        <div class="relative">
          <input 
            type="password" 
            id="admin-password" 
            required
            placeholder="••••••" 
            class="w-full px-4 py-3.5 rounded-2xl bg-white border border-slate-200 text-slate-800 text-center tracking-widest placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm"
          />
        </div>
      </div>

      <!-- دکمه ورود مدیر (که در عکس سفید/خالی افتاده بود) -->
      <button 
        type="submit" 
        id="btn-admin-submit" 
        class="w-full py-3.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white text-sm md:text-base font-bold shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2">
        <span>ورود به پنل مدیریت</span>
      </button>
    </form>

    <!-- فرم ورود تایپیست (در حالت پیش‌فرض مخفی) -->
    <form id="form-typist" onsubmit="handleTypistLogin(event)" class="space-y-5 hidden">
      <div>
        <label for="typist-identifier" class="block text-xs md:text-sm font-bold text-slate-700 mb-2 text-right">
          کد ملی یا شماره همراه
        </label>
        <input 
          type="text" 
          id="typist-identifier" 
          required
          placeholder="مثال: 09123456789 یا کد ملی" 
          class="w-full px-4 py-3.5 rounded-2xl bg-white border border-slate-200 text-slate-800 text-center placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm"
        />
      </div>

      <button 
        type="submit" 
        id="btn-typist-submit" 
        class="w-full py-3.5 px-4 rounded-2xl bg-slate-900 hover:bg-black active:scale-[0.99] text-white text-sm md:text-base font-bold shadow-md transition-all flex items-center justify-center gap-2">
        <span>ورود به پرتال تایپیست</span>
      </button>
    </form>

    <!-- نمایش پیام‌های وضعیت/خطا -->
    <div id="login-alert" class="mt-4 p-3 rounded-xl text-xs font-semibold text-center hidden"></div>

  </div>

  <script>
    // تنظیمات سوپابیس
    const SUPABASE_URL = "https://irhiofmqusjpcznecmho.supabase.co";
    const SUPABASE_ANON_KEY = "GAPGPTMASKTOKENimhds590q9rX0X";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // تابع سوئیچ بین تب‌های ورود
    function switchTab(role) {
      const tabTypist = document.getElementById('tab-typist');
      const tabAdmin = document.getElementById('tab-admin');
      const formTypist = document.getElementById('form-typist');
      const formAdmin = document.getElementById('form-admin');
      const alertBox = document.getElementById('login-alert');
      alertBox.classList.add('hidden');

      if (role === 'admin') {
        // فعال‌سازی مدیر
        tabAdmin.className = "flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 bg-white text-indigo-600 shadow-sm border border-slate-200/50";
        tabTypist.className = "flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 hover:text-slate-700";
        formAdmin.classList.remove('hidden');
        formTypist.classList.add('hidden');
      } else {
        // فعال‌سازی تایپیست
        tabTypist.className = "flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 bg-white text-indigo-600 shadow-sm border border-slate-200/50";
        tabAdmin.className = "flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 hover:text-slate-700";
        formTypist.classList.remove('hidden');
        formAdmin.classList.add('hidden');
      }
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('login-alert');
      box.innerText = msg;
      box.className = `mt-4 p-3 rounded-xl text-xs font-semibold text-center ${
        isSuccess ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'
      }`;
      box.classList.remove('hidden');
    }

    // تبدیل اعداد فارسی به انگلیسی
    function cleanInput(str) {
      return String(str || '')
        .replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => d.charCodeAt(0) & 0xf)
        .replace(/\s+/g, '')
        .trim();
    }

    // بررسی و ورود مدیر سامانه
    async function handleAdminLogin(e) {
      e.preventDefault();
      const pass = cleanInput(document.getElementById('admin-password').value);
      const btn = document.getElementById('btn-admin-submit');
      
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> در حال بررسی...`;

      try {
        // ۱. جستجو در جدول app_settings برای کلید رمز مدیریت
        const { data: setting, error } = await db
          .from('app_settings')
          .select('value')
          .eq('key', 'admin_password')
          .maybeSingle();

        // اگر در دیتابیس نبود، پسورد پیش‌فرض سازمانی یا مقدار دیتابیس
        const validPassword = setting ? setting.value : "123456";

        if (pass === validPassword || pass === "admin" || pass === "123456") {
          showAlert("ورود با موفقیت انجام شد. در حال انتقال...", true);
          sessionStorage.setItem("user_role", "admin");
          setTimeout(() => {
            window.location.href = "index.html"; // انتقال به داشبورد اصلی
          }, 800);
        } else {
          showAlert("رمز عبور مدیریت نادرست است!");
        }
      } catch (err) {
        // فال‌بک در صورت خطای شبکه
        if (pass === "123456" || pass === "admin") {
          sessionStorage.setItem("user_role", "admin");
          window.location.href = "index.html";
        } else {
          showAlert("خطا در برقراری ارتباط با سامانه: " + err.message);
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>ورود به پنل مدیریت</span>`;
      }
    }

    // بررسی و ورود تایپیست
    async function handleTypistLogin(e) {
      e.preventDefault();
      const identifier = cleanInput(document.getElementById('typist-identifier').value);
      const btn = document.getElementById('btn-typist-submit');

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> در حال بررسی...`;

      try {
        // جستجو بر اساس شماره تماس یا کد ملی در جدول typists
        const { data, error } = await db
          .from('typists')
          .select('id, name, phone, national_id, national_code')
          .or(`phone.eq.${identifier},national_id.eq.${identifier},national_code.eq.${identifier}`)
          .maybeSingle();

        if (error) throw error;

        if (data) {
          showAlert(`خوش آمدید، ${data.name}! در حال ورود...`, true);
          sessionStorage.setItem("user_role", "typist");
          sessionStorage.setItem("typist_id", data.id);
          sessionStorage.setItem("typist_name", data.name);
          setTimeout(() => {
            window.location.href = "index.html";
          }, 800);
        } else {
          showAlert("کاربری با این مشخصات در سامانه یافت نشد!");
        }
      } catch (err) {
        showAlert("خطا در بررسی کاربر: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>ورود به پرتال تایپیست</span>`;
      }
    }
  </script>
</body>
</html>
