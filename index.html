<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به سامانه تایپ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    .tab-active {
      background-color: #fff;
      color: #4f46e5;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
      border: 1px solid rgba(226,232,240,0.5);
    }
    .tab-inactive { color: #64748b; }
    .tab-inactive:hover { color: #334155; }
  </style>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 p-8 md:p-10 w-full max-w-md mx-auto transition-all">

    <!-- آیکون -->
    <div class="flex justify-center mb-5">
      <div class="w-16 h-16 bg-indigo-50 border border-indigo-100/80 rounded-2xl flex items-center justify-center shadow-sm">
        <span class="text-3xl">📝</span>
      </div>
    </div>

    <!-- تیتر -->
    <div class="text-center space-y-2 mb-8">
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">ورود به سامانه تایپ</h1>
      <p class="text-xs md:text-sm text-slate-400 font-medium">برای مشاهده یا ثبت کارکرد، وارد حساب خود شوید</p>
    </div>

    <!-- تب‌ها -->
    <div class="bg-slate-50 p-1.5 rounded-2xl flex items-center gap-1 border border-slate-200/60 mb-6" role="tablist" aria-label="انتخاب نقش">
      <button type="button" id="tab-typist" role="tab" aria-selected="false"
        onclick="switchTab('typist')"
        class="flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 tab-inactive">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        تایپیست
      </button>

      <button type="button" id="tab-admin" role="tab" aria-selected="true"
        onclick="switchTab('admin')"
        class="flex-1 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 tab-active">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        مدیر سامانه
      </button>
    </div>

    <!-- فرم مدیر -->
    <form id="form-admin" onsubmit="handleAdminLogin(event)" class="space-y-5" novalidate>
      <div>
        <label for="admin-password" class="block text-xs md:text-sm font-bold text-slate-700 mb-2 text-right">
          رمز عبور مدیریت
        </label>
        <div class="relative">
          <input type="password" id="admin-password" required autocomplete="current-password"
            placeholder="••••••"
            class="w-full px-4 py-3.5 pl-12 rounded-2xl bg-white border border-slate-200 text-slate-800 text-center tracking-widest placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm" />
          <button type="button" onclick="togglePassword('admin-password', this)"
            class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors"
            aria-label="نمایش رمز عبور">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-admin-submit"
        class="w-full py-3.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white text-sm md:text-base font-bold shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
        <span>ورود به پنل مدیریت</span>
      </button>
    </form>

    <!-- فرم تایپیست -->
    <form id="form-typist" onsubmit="handleTypistLogin(event)" class="space-y-5 hidden" novalidate>
      <div>
        <label for="typist-identifier" class="block text-xs md:text-sm font-bold text-slate-700 mb-2 text-right">
          کد ملی یا شماره همراه
        </label>
        <input type="text" id="typist-identifier" required inputmode="numeric" autocomplete="username"
          placeholder="مثال: 09123456789 یا کد ملی"
          class="w-full px-4 py-3.5 rounded-2xl bg-white border border-slate-200 text-slate-800 text-center placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm" />
      </div>

      <button type="submit" id="btn-typist-submit"
        class="w-full py-3.5 px-4 rounded-2xl bg-slate-900 hover:bg-black active:scale-[0.99] text-white text-sm md:text-base font-bold shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
        <span>ورود به پرتال تایپیست</span>
      </button>
    </form>

    <div id="login-alert" role="alert" aria-live="polite"
      class="mt-4 p-3 rounded-xl text-xs font-semibold text-center hidden"></div>
  </div>

  <script>
    'use strict';

    /* ---------- پیکربندی ---------- */
    const SUPABASE_URL = "https://irhiofmqusjpcznecmho.supabase.co";
    const SUPABASE_ANON_KEY = "GAPGPTMASKTOKENimhds590q9rX0X";
    const DEFAULT_ADMIN_PASSWORD = "123456"; // فقط برای فالبک؛ توصیه می‌شود از دیتابیس خوانده شود
    const REDIRECT_URL = "index.html";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ---------- ابزارهای کمکی ---------- */
    const $ = (id) => document.getElementById(id);

    function cleanInput(str) {
      return String(str ?? '')
        .replace(/[\u0660-\u0669\u06F0-\u06F9]/g, (d) => String.fromCharCode(d.charCodeAt(0) & 0xf))
        .replace(/\s+/g, '')
        .trim();
    }

    function showAlert(msg, type = 'error') {
      const box = $('login-alert');
      const styles = {
        error: 'bg-rose-50 text-rose-700 border border-rose-200',
        success: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
      };
      box.innerText = msg;
      box.className = `mt-4 p-3 rounded-xl text-xs font-semibold text-center ${styles[type] || styles.error}`;
      box.classList.remove('hidden');
    }

    function hideAlert() { $('login-alert').classList.add('hidden'); }

    function setLoading(btn, loading, defaultLabel) {
      btn.disabled = loading;
      btn.setAttribute('aria-busy', String(loading));
      btn.innerHTML = loading
        ? `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> در حال بررسی...`
        : `<span>${defaultLabel}</span>`;
    }

    function togglePassword(inputId, btn) {
      const input = $(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'مخفی کردن رمز عبور' : 'نمایش رمز عبور');
    }

    function saveSession(role, extra = {}) {
      sessionStorage.setItem('user_role', role);
      Object.entries(extra).forEach(([k, v]) => sessionStorage.setItem(k, String(v)));
    }

    function redirectAfterLogin() {
      setTimeout(() => { window.location.href = REDIRECT_URL; }, 800);
    }

    /* ---------- سوئیچ تب ---------- */
    function switchTab(role) {
      const isAdmin = role === 'admin';
      const tabs = { admin: $('tab-admin'), typist: $('tab-typist') };
      const forms = { admin: $('form-admin'), typist: $('form-typist') };

      Object.entries(tabs).forEach(([key, el]) => {
        const active = key === role;
        el.classList.toggle('tab-active', active);
        el.classList.toggle('tab-inactive', !active);
        el.setAttribute('aria-selected', String(active));
      });

      forms.admin.classList.toggle('hidden', !isAdmin);
      forms.typist.classList.toggle('hidden', isAdmin);
      hideAlert();
    }

    /* ---------- اعتبارسنجی ---------- */
    function isValidIdentifier(value) {
      // کد ملی ۱۰ رقمی یا شماره همراه ایرانی (۰۹xxxxxxxxx)
      return /^09\d{9}$/.test(value) || /^\d{10}$/.test(value);
    }

    /* ---------- ورود مدیر ---------- */
    async function handleAdminLogin(e) {
      e.preventDefault();
      const btn = $('btn-admin-submit');
      const pass = cleanInput($('admin-password').value);

      if (!pass) { showAlert('لطفاً رمز عبور مدیریت را وارد کنید.'); return; }

      setLoading(btn, true);

      try {
        const { data: setting, error } = await db
          .from('app_settings')
          .select('value')
          .eq('key', 'admin_password')
          .maybeSingle();

        if (error) throw error;

        const validPassword = setting?.value ?? DEFAULT_ADMIN_PASSWORD;

        if (pass === validPassword) {
          showAlert('ورود با موفقیت انجام شد. در حال انتقال...', 'success');
          saveSession('admin');
          redirectAfterLogin();
        } else {
          showAlert('رمز عبور مدیریت نادرست است!');
        }
      } catch (err) {
        console.error('[Admin login error]', err);
        showAlert('خطا در برقراری ارتباط با سامانه: ' + (err?.message || 'نامشخص'));
      } finally {
        setLoading(btn, false, 'ورود به پنل مدیریت');
      }
    }

    /* ---------- ورود تایپیست ---------- */
    async function handleTypistLogin(e) {
      e.preventDefault();
      const btn = $('btn-typist-submit');
      const identifier = cleanInput($('typist-identifier').value);

      if (!isValidIdentifier(identifier)) {
        showAlert('کد ملی یا شماره همراه معتبر وارد کنید.');
        return;
      }

      setLoading(btn, true);

      try {
        const { data, error } = await db
          .from('typists')
          .select('id, name, phone, national_id, national_code')
          .or(`phone.eq.${identifier},national_id.eq.${identifier},national_code.eq.${identifier}`)
          .maybeSingle();

        if (error) throw error;

        if (data) {
          showAlert(`خوش آمدید، ${data.name}! در حال ورود...`, 'success');
          saveSession('typist', {
            typist_id: data.id,
            typist_name: data.name,
          });
          redirectAfterLogin();
        } else {
          showAlert('کاربری با این مشخصات در سامانه یافت نشد!');
        }
      } catch (err) {
        console.error('[Typist login error]', err);
        showAlert('خطا در بررسی کاربر: ' + (err?.message || 'نامشخص'));
      } finally {
        setLoading(btn, false, 'ورود به پرتال تایپیست');
      }
    }

    /* ---------- راه‌اندازی اولیه ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('admin');
      $('admin-password').focus();
    });
  </script>
</body>
</html>
